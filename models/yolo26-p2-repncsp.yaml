# Ultralytics YOLO26 with P2 and RepNCSP
nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 2, RepNCSP, [512, False]] # 4-替换为RepNCSP，增强特征提取
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 2, RepNCSP, [512, True]]  # 6-替换为RepNCSP
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 2, RepNCSP, [1024, True]] # 8-替换为RepNCSP
  - [-1, 1, SPPF, [1024, 5]]       # 9
  - [-1, 2, C2PSA, [1024]]         # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, RepNCSP, [512, True]]      # 13-Neck替换

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, RepNCSP, [256, True]]      # 16-Neck替换

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, True]]         # 19 (P2边缘层保持轻量，用C3k2)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, RepNCSP, [256, True]]      # 22-Neck替换

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, RepNCSP, [512, True]]      # 25-Neck替换

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, RepNCSP, [1024, True]]     # 28-Neck替换

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)